schema = 1

[template]
name = "acmart"
version = "1.0.0"
engine = "latex"
title = "ACM paper"
description = "ACM conference paper in the sigconf layout using the acmart class."
authors = ["Juan José Sánchez Medina"]
license = "MIT"
keywords = ["acm", "sigconf", "computer science", "conference"]
categories = ["journal", "article"]
entrypoint = "main.tex"

[source]
repo = "https://github.com/texshelf/templates"
rev = "4f8e2ab5a6e364aeed4227246326690254c3a7df"
path = "acmart"

[latex]
compiler = "pdflatex"
bib = "bibtex"

[variables.title]
prompt = "Title"
default = "An Example Title"
files = ["main.tex"]

[registry]
official = true
