schema = 1

[template]
name = "revtex"
version = "1.0.0"
engine = "latex"
title = "APS and AIP paper (REVTeX 4.2)"
description = "Paper for Physical Review journals and AIP journals using revtex4-2, set up for PRL."
authors = ["Juan José Sánchez Medina"]
license = "MIT"
keywords = ["aps", "aip", "physical review", "prl", "prd", "physics"]
categories = ["journal", "article"]
entrypoint = "main.tex"

[source]
repo = "https://github.com/texshelf/templates"
rev = "4f8e2ab5a6e364aeed4227246326690254c3a7df"
path = "revtex"

[latex]
compiler = "pdflatex"
bib = "bibtex"

[variables.title]
prompt = "Title"
default = "An Example Title"
files = ["main.tex"]

[registry]
official = true
