schema = 1

[template]
name = "ieeetran"
version = "1.0.0"
engine = "latex"
title = "IEEE paper"
description = "Two-column IEEE conference paper using IEEEtran; one option switches it to the journal layout."
authors = ["Juan José Sánchez Medina"]
license = "MIT"
keywords = ["ieee", "conference", "transactions", "engineering"]
categories = ["journal", "article"]
entrypoint = "main.tex"

[source]
repo = "https://github.com/texshelf/templates"
rev = "4f8e2ab5a6e364aeed4227246326690254c3a7df"
path = "ieeetran"

[latex]
compiler = "pdflatex"
bib = "bibtex"

[variables.title]
prompt = "Title"
default = "An Example Title"
files = ["main.tex"]

[registry]
official = true
