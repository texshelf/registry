schema = 1

[template]
name = "llncs"
version = "1.0.0"
engine = "latex"
title = "Springer LNCS paper"
description = "Proceedings paper for Springer Lecture Notes in Computer Science using the llncs class."
authors = ["Juan José Sánchez Medina"]
license = "MIT"
keywords = ["springer", "lncs", "proceedings", "computer science"]
categories = ["journal", "article"]
entrypoint = "main.tex"

[source]
repo = "https://github.com/texshelf/templates"
rev = "4f8e2ab5a6e364aeed4227246326690254c3a7df"
path = "llncs"

[latex]
compiler = "pdflatex"
bib = "bibtex"

[variables.title]
prompt = "Title"
default = "An Example Title"
files = ["main.tex"]

[registry]
official = true
