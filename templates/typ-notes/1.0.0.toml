schema = 1

[template]
name = "typ-notes"
version = "1.0.0"
engine = "typst"
title = "Lecture notes (Typst)"
description = "Lecture notes with a running header, an outline, and definition and example blocks."
authors = ["Juan José Sánchez Medina"]
license = "MIT"
keywords = ["class", "course", "study"]
categories = ["notes"]
entrypoint = "main.typ"

[source]
repo = "https://github.com/texshelf/templates"
rev = "d51b3c80e8db9b47edb62429e29587bd29ddb3d4"
path = "typ-notes"

[variables.course]
prompt = "Course name"
default = "Course Name"
files = ["main.typ"]

[variables.author]
prompt = "Author"
default = "A. U. Thor"
files = ["main.typ"]

[registry]
official = true
