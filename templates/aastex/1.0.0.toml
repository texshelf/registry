schema = 1

[template]
name = "aastex"
version = "1.0.0"
engine = "latex"
title = "AAS journals (AASTeX v7)"
description = "Manuscript for ApJ, ApJL, ApJS, AJ and PSJ using the aastex701 class from your TeX distribution."
authors = ["Juan José Sánchez Medina"]
license = "MIT"
keywords = ["aas", "apj", "aj", "astronomy", "astrophysics", "aastex701"]
categories = ["journal", "article"]
entrypoint = "main.tex"

[source]
repo = "https://github.com/texshelf/templates"
rev = "4f8e2ab5a6e364aeed4227246326690254c3a7df"
path = "aastex"

[latex]
compiler = "pdflatex"
bib = "bibtex"

[variables.title]
prompt = "Title"
default = "An Example Title"
files = ["main.tex"]

[registry]
official = true
