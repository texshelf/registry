schema = 1

[template]
name = "article-typst"
version = "1.0.0"
engine = "typst"
title = "Article (Typst)"
description = "Short article with sections, a table and a bibliography, with no package imports."
authors = ["Juan José Sánchez Medina"]
license = "MIT"
keywords = ["paper", "report", "basic"]
categories = ["article"]
entrypoint = "main.typ"

[source]
repo = "https://github.com/texshelf/templates"
rev = "5ad42658139c3c2f55aae3996e003a64560b7abc"
path = "article-typst"

[typst]
compiler = "0.11.0"

[variables.title]
prompt = "Title"
default = "An Example Title"
files = ["main.typ"]

[variables.author]
prompt = "Author"
default = "A. U. Thor"
files = ["main.typ"]

[registry]
official = true
