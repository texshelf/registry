schema = 1

[template]
name = "notes-typst"
version = "1.0.0"
engine = "typst"
title = "Lecture notes (Typst)"
description = "Lecture notes with a running header, an outline, and definition and example blocks."
authors = ["Juan José Sánchez Medina"]
license = "MIT"
keywords = ["class", "course", "study"]
categories = ["notes"]
entrypoint = "main.typ"

[source]
repo = "https://github.com/texshelf/templates"
rev = "5ad42658139c3c2f55aae3996e003a64560b7abc"
path = "notes-typst"

[typst]
compiler = "0.11.0"

[variables.course]
prompt = "Course name"
default = "Course Name"
files = ["main.typ"]

[variables.author]
prompt = "Author"
default = "A. U. Thor"
files = ["main.typ"]

[registry]
official = true
